name: Repository layout
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  layout:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.11'
      - name: Directory roles and agent routes
        run: python3 skills/repository-organization/scripts/check_layout.py --config docs/maintainers/repository-layout.json
      - name: Misplacement, staged contents and compatibility fixtures
        run: python3 skills/repository-organization/scripts/test_check_layout.py
