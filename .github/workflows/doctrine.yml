name: doctrine
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Git identity for tests that make commits
        run: |
          git config --global user.name "doctrine-map tests"
          git config --global user.email "tests@example.invalid"
      - name: Repository structure
        run: python scripts/check_repository_structure.py
      - name: Tests
        run: python -m unittest discover -s tests -v
      - name: Viewer membership and legacy snapshot regression checks
        run: node scripts/test_map_model.js
      - name: Doctrine check on this repository
        run: python doctrine.py check
      - name: Doctrine check on the example repository
        working-directory: examples/demo-repo
        run: python ../../doctrine.py check
