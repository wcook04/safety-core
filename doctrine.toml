# doctrine.toml: the single source of this repository's agent doctrine.
#
# Everything agents read is generated from this file by `doctrine build`: the entry
# card in AGENTS.md and CLAUDE.md, path-scoped rules for each agent, the reminders hooks
# deliver while agents work, and the map. Edit this file, never the generated ones.
#
# Shape: a few axioms (each with the anti-axiom it rejects), principles that serve them
# (each paired with an anti-principle), routes that attach principles to the places in a
# repository they govern, and the published sources each claim rests on.
#
# Enforcement levels, strongest first. A principle's level is the strongest it actually has:
#   block   a hook refuses the action
#   ask     a hook stops and asks a person
#   check   CI or `doctrine check` fails
#   remind  a factual reminder reaches the agent where and when it works
#   advise  a note to the person at the end of a turn
#   prose   written down only; the map shows it hollow

[doctrine]
name = "safety-core"
version = "0.1.0"
summary = "Seven axioms and fifteen principles for AI agents working in a code repository, grounded in published guidance from Anthropic, OpenAI, OWASP, MITRE and OpenSSF."
entry_budget_lines = 40

