<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Safety Core · rules</title>
<link rel="icon" href="data:,">
<style>
:root {
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  --bg: #f4f3ef;
  --ink: #1c1e21;
  --ink-2: #474b52;
  --muted: #676b72;
  --line: #d9d6ce;
  --line-2: #e6e3dc;
  --link: #9a9da3;
  --accent: #285a88;
  --accent-soft: rgba(40, 90, 136, 0.10);
  --gap: #9a4a2f;
  --halo: #f4f3ef;
  --cell-off: #b9b6ae;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15171a; --ink: #e6e4df; --ink-2: #bfc2c7; --muted: #9196a0; --line: #2d3137;
    --line-2: #23272c; --link: #5e646d; --accent: #8db3d9; --accent-soft: rgba(141, 179, 217, 0.12);
    --gap: #d59478; --halo: #15171a; --cell-off: #4c525a;
  }
}
:root[data-theme="dark"] {
  --bg: #15171a; --ink: #e6e4df; --ink-2: #bfc2c7; --muted: #9196a0; --line: #2d3137;
  --line-2: #23272c; --link: #5e646d; --accent: #8db3d9; --accent-soft: rgba(141, 179, 217, 0.12);
  --gap: #d59478; --halo: #15171a; --cell-off: #4c525a;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg); color: var(--ink); font: 14px/1.5 var(--sans);
  display: flex; flex-direction: column; min-height: 100%; overflow: hidden;
  -webkit-font-smoothing: antialiased;
}
button, select { font: inherit; color: inherit; }
a { color: var(--accent); text-underline-offset: 2px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------------------------------------------------------------- header */
.top {
  display: flex; align-items: center; gap: 24px; flex-wrap: wrap;
  padding: 14px 24px 12px; border-bottom: 1px solid var(--line);
}
.ident { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; min-width: 0; }
.ident h1 { font-size: 17px; font-weight: 650; margin: 0; letter-spacing: -0.01em; }
.ident .ver, .ident .repo { font: 12px var(--mono); color: var(--muted); }
.status { font: 12px var(--mono); color: var(--muted); display: inline-flex; align-items: center; gap: 7px; }
.status .dot { width: 7px; height: 7px; border-radius: 50%; border: 1.5px solid var(--muted); }
.status.live .dot { background: var(--accent); border-color: var(--accent); }
.tools { margin-left: auto; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.toggle {
  display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px 6px 10px;
  border: 1px solid var(--line); border-radius: 6px; background: transparent; cursor: pointer;
  font-size: 13px; color: var(--ink-2);
}
.toggle .box {
  width: 12px; height: 12px; border: 1.5px solid var(--ink-2); border-radius: 3px; position: relative;
}
.toggle[aria-pressed="true"] { border-color: var(--accent); color: var(--ink); background: var(--accent-soft); }
.toggle[aria-pressed="true"] .box { border-color: var(--accent); background: var(--accent); }
.toggle[aria-pressed="true"] .box::after {
  content: ""; position: absolute; left: 3px; top: 0px; width: 3px; height: 7px;
  border: solid var(--bg); border-width: 0 1.5px 1.5px 0; transform: rotate(45deg);
}
.toggle:hover { border-color: var(--ink-2); }
.stand-pick {
  font: 12.5px var(--mono); padding: 5px 8px; border: 1px solid var(--line); border-radius: 6px;
  background: var(--bg); max-width: 200px;
}
.stand-pick[hidden] { display: none; }

/* ---------------------------------------------------------------- coverage strip */
.coverage {
  display: flex; align-items: center; gap: 28px; flex-wrap: wrap;
  padding: 10px 24px; border-bottom: 1px solid var(--line); font-size: 13px; color: var(--ink-2);
}
.cov-main { display: flex; flex-direction: column; gap: 3px; min-width: 250px; flex: 1; }
.cov-main .kicker { font: 11.5px var(--mono); color: var(--muted); }
.cov-main .head { color: var(--ink); font-size: 14px; }
.cov-main .head b { font-size: 17px; font-weight: 650; font-variant-numeric: tabular-nums; }
.cov-main .exec { font-size: 12.5px; color: var(--muted); }
.cov-main .exec .n { font-family: var(--mono); color: var(--ink-2); }
.coverage .gaps-btn { border: 0; padding: 0; min-height: 24px; font-size: 12.5px; text-decoration: underline; text-underline-offset: 2px; }
.headrow { display: flex; align-items: center; gap: 6px 22px; flex-wrap: wrap; }
.levels { display: flex; gap: 4px; flex-wrap: wrap; list-style: none; margin: 0; padding: 0; }
.lvl {
  display: inline-flex; align-items: center; gap: 7px; padding: 4px 7px; border: 1px solid transparent;
  border-radius: 6px; background: transparent; cursor: default; font-size: 12.5px; color: var(--ink-2);
  min-height: 28px;
}
.lvl:hover, .lvl:focus-visible { border-color: var(--line); color: var(--ink); }
.lvl b { font: 600 12.5px var(--mono); color: var(--ink); font-variant-numeric: tabular-nums; }
.lvl.zero b { color: var(--muted); font-weight: 400; }
/* mechanism tags: categorical, not a strength scale */
.mode {
  display: inline-block; font: 11.5px/1 var(--mono); padding: 3px 6px 3px; border-radius: 4px;
  border: 1px solid transparent; white-space: nowrap; vertical-align: middle;
}
.mode.m-stop { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.mode.m-tell { border-color: var(--ink-2); color: var(--ink); }
.mode.m-words { border-color: var(--line); border-style: dashed; color: var(--muted); }
.cov-meta { display: grid; grid-template-columns: auto auto; gap: 2px 18px; margin-left: auto; font-size: 12.5px; align-items: center; justify-items: start; }
.cov-meta .n { font-family: var(--mono); color: var(--ink); }
.gaps-btn {
  border: 1px solid var(--line); background: transparent; border-radius: 6px; padding: 2px 9px;
  cursor: pointer; color: var(--gap); font-size: 12.5px;
}
.gaps-btn:hover { border-color: var(--gap); }

/* ---------------------------------------------------------------- stage */
.stage { flex: 1; display: flex; min-height: 0; }
.map-wrap { flex: 1; position: relative; min-width: 0; overflow: hidden; display: flex; flex-direction: column; }
#map { display: block; width: 100%; flex: 1; min-height: 0; touch-action: none; user-select: none; -webkit-user-select: none; cursor: grab; }
.tracebar { display: flex; align-items: center; gap: 14px; padding: 8px 16px; border-bottom: 1px solid var(--line-2); min-height: 44px; flex-wrap: wrap; }
.trace { font-size: 13px; color: var(--ink-2); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; min-width: 0; }
.trace .lab { font: 11.5px var(--mono); color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
.trace .rname { font: 600 13.5px var(--mono); color: var(--accent); }
.trace .rname.dead { color: var(--gap); }
.trace .clear { border: 1px solid var(--line); background: transparent; border-radius: 6px; padding: 2px 9px; cursor: pointer; font-size: 12.5px; color: var(--ink-2); min-height: 26px; }
.trace .clear:hover { border-color: var(--ink-2); color: var(--ink); }
#map.panning { cursor: grabbing; }
.zoom { display: flex; gap: 4px; flex: none; }
.zoom button { height: 26px !important; min-width: 28px !important; font-size: 12px !important; }
.zoom button {
  min-width: 30px; height: 28px; padding: 0 8px; border: 1px solid var(--line); border-radius: 6px;
  background: var(--bg); cursor: pointer; font: 13px var(--mono); color: var(--ink-2);
}
.zoom button:hover { border-color: var(--ink-2); color: var(--ink); }
.message { position: absolute; inset: 0; display: grid; place-items: center; padding: 24px; color: var(--ink-2); text-align: center; }
.message[hidden] { display: none; }

/* ---------------------------------------------------------------- svg marks */
#map text { font-family: var(--sans); fill: var(--ink); }
.colhead { font: 600 10.5px var(--sans) !important; letter-spacing: 0.08em; text-transform: uppercase; fill: var(--muted) !important; }
.colrule { stroke: var(--line-2); stroke-width: 1; }
.node { cursor: pointer; outline: none; transition: opacity 260ms ease; }
.node .hit { fill: transparent; }
.node .ring { fill: none; stroke: var(--accent); stroke-width: 1.5; opacity: 0; }
.node:focus-visible .ring { opacity: 1; }
.node.selected .ring { opacity: 0.55; }
.node:hover .hit { fill: var(--accent-soft); }
.node.selected .hit { fill: var(--accent-soft); }

.ax-bar { fill: var(--ink); transition: fill 200ms; }
.ax-name { font: 600 14px var(--sans); }
.ax-meta, .pr-id, .pr-level, .pr-note, .pl-count, .pl-note, .rt-label, .stub-text, .gh-label { font-family: var(--mono) !important; }
.ax-meta { font-size: 12px; fill: var(--muted) !important; }
.pr-name { font: 500 14px var(--sans); }
.pr-id { font-size: 12px; fill: var(--muted) !important; }
.pr-note, .pl-note { fill: var(--gap) !important; font-size: 12px; }
.pr-every { font: 400 12px var(--mono); fill: var(--muted) !important; }
.tag-bg { stroke-width: 1; }
.tag-bg.m-stop { fill: var(--ink); stroke: var(--ink); }
.tag-bg.m-tell { fill: var(--bg); stroke: var(--ink-2); }
.tag-bg.m-words { fill: var(--bg); stroke: var(--cell-off); stroke-dasharray: 2.5 2; }
.tag-txt { font: 400 11.5px var(--mono) !important; }
.tag-txt.m-stop { fill: var(--bg) !important; }
.tag-txt.m-tell { fill: var(--ink) !important; }
.tag-txt.m-words { fill: var(--muted) !important; }
.anchor { fill: var(--ink); }
.anchor.open { fill: var(--bg); stroke: var(--muted); stroke-width: 1.25; }

.rt-dot { fill: var(--bg); stroke: var(--ink); stroke-width: 1.5; }
.rt-core { fill: var(--ink); }
.dead .rt-dot { stroke: var(--gap); stroke-dasharray: 2 2; }
.rt-label { font-size: 12px; fill: var(--ink-2) !important; }
.rt-plate { fill: var(--bg); }
.rt-zero { font: 400 11.5px var(--mono) !important; fill: var(--gap) !important; }
.node.route.lit .rt-label, .node.route.selected .rt-label { font-weight: 600; }
.node.route.traced .rt-dot { stroke: var(--accent); stroke-width: 2; }
.node.route.traced .rt-core { fill: var(--accent); }
.node.route.traced .rt-label { fill: var(--accent) !important; font-weight: 600; }
.lnk.hidden { display: none; }
.pr-meta { font: 400 12px var(--mono) !important; }
.dead .rt-label { fill: var(--gap) !important; }

.pl-mark { fill: var(--ink); }
.pl-mark.open { fill: var(--bg); stroke: var(--muted); stroke-width: 1.25; }
.pl-mark.exposed { fill: var(--bg); stroke: var(--gap); stroke-width: 1.5; }
.pl-name { font: 400 13px var(--mono) !important; }
.pl-name.quiet { fill: var(--ink-2) !important; }
.pl-count { font-size: 12px; fill: var(--muted) !important; }
.tree { stroke: var(--line); stroke-width: 1; fill: none; }
.gh-mark { fill: none; stroke: var(--gap); stroke-width: 1.25; stroke-dasharray: 2 2; }
.gh-label { font-size: 11.5px; fill: var(--muted) !important; font-style: italic; }
.sect { font: 600 10px var(--sans) !important; letter-spacing: 0.08em; text-transform: uppercase; fill: var(--muted) !important; }

.lnk { fill: none; stroke: var(--link); stroke-width: 1; opacity: 0.7; transition: opacity 260ms ease, stroke 200ms; }
.lnk.dead { stroke: var(--gap); stroke-dasharray: 3 3; }
.lnk.serves { stroke-dasharray: 2 3; }
.lnk.lit { stroke: var(--accent); stroke-width: 1.75; opacity: 1; }
.node.selected .ring { opacity: 1; stroke-width: 1.5; }
.node.lit .ax-bar, .node.selected .ax-bar { fill: var(--accent); }
.node.lit .ax-name, .node.lit .pr-name, .node.lit .pl-name, .node.selected .ax-name, .node.selected .pr-name, .node.selected .pl-name { fill: var(--accent); }
.node.lit .rt-dot { stroke: var(--accent); }
.node.lit .rt-core { fill: var(--accent); }
.node.lit .anchor, .node.lit .pl-mark:not(.open):not(.exposed) { fill: var(--accent); }
.node.lit .rt-label { fill: var(--accent) !important; }

/* ---------------------------------------------------------------- session trace */
.ev-bg { stroke-width: 1.25; }
.ev-bg.ev-stop { fill: var(--accent); stroke: var(--accent); }
.ev-bg.ev-tell { fill: var(--bg); stroke: var(--accent); }
.ev-txt { font: 500 11.5px var(--sans) !important; }
.ev-txt.ev-stop { fill: var(--bg) !important; }
.ev-txt.ev-tell { fill: var(--accent) !important; }
.pl-visit { fill: none; stroke: var(--accent); stroke-width: 1.5; }
.pl-how { font: 400 12px var(--sans) !important; fill: var(--accent) !important; }
.rt-sent { font: 400 11.5px var(--sans) !important; fill: var(--accent) !important; }
.rt-unsent { font: 400 11.5px var(--sans) !important; fill: var(--muted) !important; }
.node.sess-off { pointer-events: auto; }
.trace { flex: 1; }
.trace .trace-opens { margin-left: auto; display: inline-flex; gap: 6px; flex-wrap: wrap; }
.trace .step-pos { font: 12.5px var(--mono); color: var(--ink-2); }
.trace .clear[aria-pressed="true"] { border-color: var(--accent); color: var(--ink); background: var(--accent-soft); }
.steps { list-style: none; margin: 0; padding: 0; counter-reset: none; }
.steps > li { border-left: 2px solid var(--line); margin-left: 11px; padding: 0 0 2px 0; }
.steps > li.on { border-left-color: var(--accent); }
.step-btn {
  display: grid; grid-template-columns: 24px 1fr auto; gap: 2px 10px; width: calc(100% + 11px); text-align: left;
  margin-left: -12px; padding: 7px 8px 7px 0; border: 0; background: transparent; border-radius: 5px; cursor: pointer; color: var(--ink-2);
}
.step-btn:hover { background: var(--accent-soft); }
.step-btn .sn {
  width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid var(--line); background: var(--bg);
  display: grid; place-items: center; font: 11px var(--mono); color: var(--ink-2); grid-row: span 3; align-self: start;
}
.steps > li.on .step-btn .sn { border-color: var(--accent); background: var(--accent); color: var(--bg); }
.steps > li.stop .step-btn .sn { border-color: var(--accent); color: var(--accent); }
.steps > li.on.stop .step-btn .sn { color: var(--bg); }
.step-btn .sv { color: var(--ink); font-weight: 600; font-size: 13.5px; }
.step-btn .sat { font: 11px var(--mono); color: var(--muted); white-space: nowrap; }
.step-btn .sc { grid-column: 2 / 4; font: 12px/1.45 var(--mono); color: var(--ink-2); overflow-wrap: anywhere;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.steps > li.on .step-btn .sc { -webkit-line-clamp: 6; }
.step-btn .so { grid-column: 2 / 4; font-size: 12.5px; color: var(--muted); }
.step-btn .so.failed { color: var(--gap); }
.step-btn .sd { grid-column: 2 / 4; font-size: 12.5px; color: var(--accent); }
.steps > li.on .step-btn .sd { display: none; }
.step-more { padding: 2px 0 12px 22px; font-size: 13px; }
.step-more .said { border-left: 2px solid var(--accent); padding-left: 10px; margin: 6px 0 10px; color: var(--ink); font-size: 12.5px; overflow-wrap: anywhere; }
.step-more .fl { margin: 4px 0; }
.step-more .fl .mono { color: var(--ink); overflow-wrap: anywhere; }
.step-more .fl .why { display: block; color: var(--muted); font-size: 12.5px; }
.sess-facts { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; margin: 12px 0 4px; font-size: 13px; }
.sess-facts dt { color: var(--muted); }
.sess-facts dd { margin: 0; color: var(--ink); }
.sess-bound { font-size: 12.5px; color: var(--muted); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; margin: 10px 0 4px; }
.trace-open { display: flex; gap: 8px; flex-wrap: wrap; margin: 8px 0 4px; }
.trace-open button { border: 1px solid var(--line); background: transparent; border-radius: 6px; padding: 5px 10px; cursor: pointer; font-size: 13px; color: var(--ink); min-height: 32px; }
.trace-open button:hover { border-color: var(--accent); }
.mobile-sess { margin: 0 0 14px; }

/* ---------------------------------------------------------------- panel */
.panel {
  width: clamp(300px, 23vw, 400px); border-left: 1px solid var(--line); overflow-y: auto;
  padding: 22px 22px 40px; font-size: 14px; color: var(--ink-2);
}
.panel .facts { display: grid; grid-template-columns: 92px 1fr; gap: 10px 12px; margin: 14px 0 4px; align-items: baseline; }
.panel .facts dt { font-size: 12px; color: var(--muted); }
.panel .facts dd { margin: 0; color: var(--ink); }
.panel .differs { color: var(--gap); }
.panel .key { display: grid; grid-template-columns: 68px 1fr; gap: 6px 10px; align-items: center; margin: 0; padding: 0; }
.panel .key li { display: contents; }
.panel details.how { margin-top: 18px; }
.panel details.how summary { cursor: pointer; color: var(--ink); font-size: 13px; }
.panel details.how p { margin-top: 8px; }
.issue { padding: 6px 8px; margin: 0 -8px; border-radius: 5px; cursor: pointer; display: block; width: calc(100% + 16px); text-align: left; border: 0; background: transparent; color: var(--ink-2); font-size: 13px; }
.issue:hover { background: var(--accent-soft); }
.issue .k { display: block; font: 11.5px var(--mono); color: var(--muted); }
.issue.warn .k { color: var(--gap); }
.panel .inherit { font: 11.5px var(--mono); color: var(--muted); margin: 14px 0 6px; }
.panel h2 { font-size: 18px; line-height: 1.3; font-weight: 650; color: var(--ink); margin: 0 0 4px; letter-spacing: -0.01em; }
.panel h3 { font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin: 24px 0 8px; }
.panel p { margin: 0 0 10px; }
.panel .kind { font: 11.5px var(--mono); color: var(--muted); margin-bottom: 8px; display: flex; gap: 10px; align-items: center; }
.panel .lead { font-size: 15px; color: var(--ink); line-height: 1.5; }
.panel .clause { font: 12.5px/1.55 var(--mono); color: var(--ink); background: transparent; border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; overflow-wrap: anywhere; }
.panel .anti { border-left: 2px solid var(--line); padding-left: 12px; font-style: italic; }
.panel ul { list-style: none; margin: 0; padding: 0; }
.panel .back { border: 0; background: transparent; padding: 0; color: var(--accent); cursor: pointer; font-size: 12.5px; margin-bottom: 14px; }
.row-btn {
  display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; padding: 6px 8px; margin: 0 -8px;
  border: 0; background: transparent; border-radius: 5px; cursor: pointer; color: var(--ink);
}
.row-btn:hover { background: var(--accent-soft); }
.row-btn .sub { color: var(--muted); font: 11px var(--mono); margin-left: auto; white-space: nowrap; }
.row-btn .txt { min-width: 0; }
.mono { font-family: var(--mono); font-size: 12.5px; }
.src { margin: 0 0 14px; }
.src .t { color: var(--ink); }
.src .m { font: 11.5px var(--mono); color: var(--muted); }
.src blockquote { margin: 6px 0 0; padding-left: 12px; border-left: 2px solid var(--line); font-style: italic; }
.enf { display: flex; gap: 10px; align-items: baseline; padding: 4px 0; flex-wrap: wrap; }
.enf .ref { font: 12px var(--mono); color: var(--ink); }
.enf .st { font: 11.5px var(--mono); color: var(--muted); }
.enf .st.missing { color: var(--gap); }
.gapnote { color: var(--gap); }
.gap-item { padding: 6px 8px; margin: 0 -8px; border-radius: 5px; cursor: pointer; display: block; width: calc(100% + 16px); text-align: left; border: 0; background: transparent; color: var(--ink-2); }
.gap-item:hover { background: var(--accent-soft); }
.gap-item .k { display: block; font: 11px var(--mono); color: var(--gap); }
.legend li { display: grid; grid-template-columns: 40px 64px 1fr; gap: 8px; align-items: center; padding: 3px 0; }
.legend .lv { font: 12px var(--mono); color: var(--ink); }
.enforce-pair { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; align-items: center; }
.enforce-pair .lab { color: var(--muted); font-size: 12.5px; }
details.entry summary { cursor: pointer; color: var(--ink); }
details.entry pre { font: 11.5px/1.55 var(--mono); white-space: pre-wrap; color: var(--ink-2); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; margin: 8px 0 0; }
.reminder { color: var(--ink); border-left: 2px solid var(--accent); padding-left: 12px; margin: 4px 0 8px; }
.route-block { margin-bottom: 16px; }
.route-block .rn { font: 12.5px var(--mono); color: var(--ink); }
.route-block .on { font: 11.5px var(--mono); color: var(--muted); }
.mobile-route { display: none; }
@media (max-width: 600px) {
  .mobile-route { display: block; padding: 16px; border-bottom: 1px solid var(--line); }
  .mobile-route label { display: block; font-weight: 600; margin-bottom: 8px; }
  .mobile-route select { width: 100%; min-height: 44px; background: var(--bg); color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 8px; font: inherit; }
  .mobile-route h2 { font-size: 18px; margin: 18px 0 8px; }
  .mobile-route ul { padding: 0; margin: 0; list-style: none; }
  .mobile-route .row-btn { min-height: 44px; }
  .mobile-route .row-btn .txt, .mobile-route .mono { overflow-wrap: anywhere; }
  .mobile-route p { line-height: 1.5; }
  #map, .tracebar, .tools { display: none; }
  .step-btn { min-height: 44px; }
}
@media (max-width: 860px) {
  body { overflow: auto; display: block; }
  .top { padding: 12px 16px; gap: 10px; }
  .tools { margin-left: 0; }
  .coverage { padding: 10px 16px; gap: 12px; }
  .cov-meta { margin-left: 0; }
  .stage { display: block; }
  .map-wrap { border-bottom: 1px solid var(--line); }
  #map { flex: none; }
  .panel { width: auto; border-left: 0; padding: 18px 16px 40px; overflow: visible; }
}
@media (min-width: 2200px) {
  body { font-size: 15.5px; }
  .ident h1 { font-size: 20px; }
  .ident .ver, .ident .repo, .status { font-size: 13.5px; }
  .toggle { font-size: 14.5px; padding: 8px 14px 8px 12px; }
  .coverage, .cov-meta, .lvl, .lvl b { font-size: 14px; }
  .cov-main .head b { font-size: 20px; }
  .panel { font-size: 15px; width: clamp(380px, 21vw, 500px); padding: 28px 30px 48px; }
  .panel h2 { font-size: 21px; }
  .panel h3 { font-size: 12px; }
  .panel .lead { font-size: 16.5px; }
  .mono, .panel .clause, .src .m, .enf .ref, .enf .st, .row-btn .sub { font-size: 13.5px; }
}
@media (prefers-reduced-motion: reduce) {
  .node, .lnk, .cell.on, .cell.off { transition: none; }
}
</style>
</head>
<body>
<header class="top">
  <div class="ident">
    <h1 id="docName">Safety Core</h1>
    <span class="ver" id="docVer"></span>
    <span class="repo" id="repoName"></span>
    <span class="status" id="status"><span class="dot"></span><span id="statusText">Loading</span></span>
  </div>
  <div class="tools" role="toolbar" aria-label="Map views">
    <button class="toggle" id="tEnforced" type="button" aria-pressed="false" title="Fade principles whose configured mechanism is a reminder, advice or written guidance"><span class="box"></span>Only block, ask or check</button>
    <button class="toggle" id="tStand" type="button" aria-pressed="false" title="Pick a folder or file and fade everything the configuration does not associate with it"><span class="box"></span>View from one place</button>
    <button class="toggle" id="tAll" type="button" aria-pressed="false" title="Draw every route connection at once instead of one traced route"><span class="box"></span>Show all connections</button>
    <select class="stand-pick" id="standPick" aria-label="Place to view from" hidden></select>
  </div>
</header>
<section class="coverage" id="coverage" aria-label="Configuration summary"></section>
<main class="stage">
  <div class="map-wrap" id="mapWrap">
    <div class="tracebar">
      <div class="zoom">
        <button type="button" id="zOut" aria-label="Zoom out">&minus;</button>
        <button type="button" id="zIn" aria-label="Zoom in">+</button>
        <button type="button" id="zFit" aria-label="Fit the map to the window">Fit</button>
      </div>
      <div class="trace" id="trace" aria-live="polite"></div>
    </div>
    <section class="mobile-route" aria-label="Selected route">
      <div class="mobile-sess" id="mobileSess" hidden></div>
      <label for="routePick">Trace a route</label>
      <select id="routePick"></select>
      <div id="mobileTrace"></div>
      <label for="placePick" style="margin-top:20px">Read a folder’s purpose</label>
      <select id="placePick"></select>
    </section>
    <svg id="map" role="group" aria-label="Safety Core rule view. Use arrow keys to move between marks and Enter to open one. Selecting a route draws its connections."></svg>
    <div class="message" id="message" hidden></div>
  </div>
  <aside class="panel" id="panel" aria-label="Details"></aside>
</main>
<div class="sr" id="announce" aria-live="polite"></div>
<input type="file" id="traceFile" accept=".json,application/json" hidden>
<script id="doctrine-graph" type="application/json"></script>
<script id="doctrine-trace" type="application/json"></script>
<script>
/* doctrine-map viewer. Reads doctrine-map/graph@1 and draws the doctrine and the
   repository as one deterministic picture: axioms, the principles that serve them,
   the routes that deliver principles, and the places in the repository they reach.
   No dependencies. Works from file:// when the graph is inlined above. */
(function () {
  'use strict';

  const SVGNS = 'http://www.w3.org/2000/svg';
  const LEVELS = ['block', 'ask', 'check', 'remind', 'advise', 'prose'];
  const STRENGTH = { block: 5, ask: 4, check: 3, remind: 2, advise: 1, prose: 0 };
  const MEANING = {
    block: 'A hook refuses the action.',
    ask: 'A hook stops and asks a person.',
    check: 'CI or the doctrine check fails.',
    remind: 'A factual reminder reaches the agent where it works.',
    advise: 'A note to the person at the end of a turn.',
    prose: 'Written down only.',
  };
  const MODE_NAME = { block: 'block', ask: 'ask', check: 'check', remind: 'remind', advise: 'advise', prose: 'written' };
  const MODE_CLASS = { block: 'm-stop', ask: 'm-stop', check: 'm-stop', remind: 'm-tell', advise: 'm-tell', prose: 'm-words' };
  const LIMIT = {
    block: 'A hook refuses the tool calls its matcher sees. Actions outside that matcher, or outside the agent, are not covered.',
    ask: 'A hook pauses the tool calls its matcher sees and asks a person. Other tools pass, and the person can still approve.',
    check: 'CI or the doctrine check fails after the change is made. It does not stop the agent while it works.',
    remind: 'A reminder delivers text to the agent. Nothing checks whether the agent followed it.',
    advise: 'A note to the person at the end of a turn. It does not change what the agent did.',
    prose: 'Written in the entry card only. Nothing delivers it to particular places or checks it.',
  };
  const ON_WORDS = { read: 'reads', edit: 'edits files', shell: 'runs commands' };
  const SANS = '-apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, Roboto, "Helvetica Neue", Arial, sans-serif';
  const MONO = 'ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace';
  const F = {
    axiom: '600 14px ' + SANS,
    pr: '500 14px ' + SANS,
    tag: '400 11.5px ' + MONO,
    mono12: '400 12px ' + MONO,
    anti: 'italic 400 11.5px ' + SANS,
    mono11: '400 12px ' + MONO,
    mono105: '400 10.5px ' + MONO,
    place: '400 13px ' + MONO,
    ghost: 'italic 400 11.5px ' + MONO,
  };
  const reduceMotion = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);

  const $ = (id) => document.getElementById(id);
  const svg = $('map');
  const panel = $('panel');

  const S = {
    graph: null, M: null, L: null, origin: '', live: false, lastRedraw: '',
    selected: null, hover: null, levelHover: null,
    enforcedOnly: false, standAt: null, trace: null, showAll: false,
    user: { k: 1, x: 0, y: 0 }, base: { k: 1, x: 0, y: 0 },
    focusId: null,
    nodes: new Map(), links: new Map(), cur: new Map(), tween: 0,
    layers: null,
    session: null, step: null, baseGraph: null, traceError: '', exampleUrl: null, playing: 0,
  };

  // ------------------------------------------------------------------ helpers
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  function natural(a, b) {
    const x = String(a), y = String(b);
    return x.localeCompare(y, 'en', { numeric: true, sensitivity: 'base' });
  }
  function el(tag, attrs, parent) {
    const e = document.createElementNS(SVGNS, tag);
    if (attrs) for (const k in attrs) if (attrs[k] != null) e.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(e);
    return e;
  }
  function txt(parent, x, y, s, cls, attrs) {
    const t = el('text', Object.assign({ x: x, y: y, class: cls, 'dominant-baseline': 'central' }, attrs || {}), parent);
    t.textContent = s;
    return t;
  }
  const measurer = document.createElement('canvas').getContext('2d');
  function width(s, font) { measurer.font = font; return measurer.measureText(s).width; }
  function fit(s, font, max) {
    s = String(s || '');
    if (width(s, font) <= max) return s;
    let lo = 0, hi = s.length;
    while (lo < hi) {
      const mid = (lo + hi + 1) >> 1;
      if (width(s.slice(0, mid).trimEnd() + '…', font) <= max) lo = mid; else hi = mid - 1;
    }
    return s.slice(0, lo).trimEnd() + '…';
  }
  function wrap(s, font, max, maxLines) {
    const words = String(s || '').split(/\s+/).filter(Boolean);
    const lines = [];
    let line = '';
    for (let i = 0; i < words.length; i++) {
      const tryLine = line ? line + ' ' + words[i] : words[i];
      if (width(tryLine, font) <= max || !line) { line = tryLine; continue; }
      lines.push(line); line = words[i];
      if (lines.length === maxLines) { line = null; break; }
    }
    if (line) lines.push(line);
    if (lines.length > maxLines || (line === null)) {
      const kept = lines.slice(0, maxLines);
      kept[maxLines - 1] = fit(kept[maxLines - 1] + ' ' + words.join(' ').slice(kept.join(' ').length), font, max);
      return kept;
    }
    return lines.map((l) => fit(l, font, max));
  }
  function modeTag(m) { return '<span class="mode ' + MODE_CLASS[m] + '">' + MODE_NAME[m] + '</span>'; }
  function plural(n, one, many) { return n + ' ' + (n === 1 ? one : (many || one + 's')); }
  function fmtDate(iso) {
    const d = new Date(iso);
    if (isNaN(d)) return iso || '';
    const m = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'][d.getUTCMonth()];
    const p = (n) => String(n).padStart(2, '0');
    return d.getUTCDate() + ' ' + m + ' ' + d.getUTCFullYear() + ', ' + p(d.getUTCHours()) + ':' + p(d.getUTCMinutes()) + ' UTC';
  }
  // ------------------------------------------------------------------ model
  function buildModel(g) {
    const byId = new Map();
    for (const n of g.nodes || []) byId.set(n.id, n);
    const of = (k) => (g.nodes || []).filter((n) => n.kind === k);
    const axioms = of('axiom').sort((a, b) => natural(a.id, b.id));
    const principles = of('principle');
    const routes = of('route').sort((a, b) => natural(a.id, b.id));
    const places = of('place');

    const routePr = new Map(routes.map((r) => [r.id, []]));
    const routePl = new Map(routes.map((r) => [r.id, []]));
    const memberships = new Map();
    const prAx = new Map(principles.map((p) => [p.id, []]));
    let sawApplies = false, sawGoverns = false, sawServes = false;
    for (const e of g.edges || []) {
      if (e.kind === 'governs' && Array.isArray(e.matched_files)) memberships.set(e.from + '\n' + e.to, new Set(e.matched_files));
      if (e.kind === 'applies' && routePr.has(e.from) && byId.has(e.to)) { sawApplies = true; if (!routePr.get(e.from).includes(e.to)) routePr.get(e.from).push(e.to); }
      if (e.kind === 'governs' && routePl.has(e.from) && byId.has(e.to)) { sawGoverns = true; if (!routePl.get(e.from).includes(e.to)) routePl.get(e.from).push(e.to); }
      if (e.kind === 'serves' && prAx.has(e.from) && byId.has(e.to)) { sawServes = true; if (!prAx.get(e.from).includes(e.to)) prAx.get(e.from).push(e.to); }
    }
    if (!sawApplies) for (const r of routes) routePr.set(r.id, (r.principles || []).filter((p) => byId.has(p)));
    if (!sawGoverns) for (const pl of places) for (const r of pl.routes || []) if (routePl.has(r)) routePl.get(r).push(pl.id);
    for (const p of principles) {
      const declared = (p.axioms || []).filter((a) => byId.has(a));
      if (declared.length) prAx.set(p.id, declared.concat(prAx.get(p.id).filter((a) => !declared.includes(a))));
      else if (!sawServes) prAx.set(p.id, []);
    }
    const prRoutes = new Map(principles.map((p) => [p.id, []]));
    for (const [r, ps] of routePr) for (const p of ps) prRoutes.get(p) && prRoutes.get(p).push(r);
    const plRoutes = new Map(places.map((p) => [p.id, []]));
    for (const [r, ps] of routePl) for (const p of ps) plRoutes.get(p) && plRoutes.get(p).push(r);
    for (const [rid, ids] of routePl) {
      routePl.set(rid, ids.filter((id) => {
        const p = byId.get(id), hits = memberships.get(rid + '\n' + id);
        if (!p.is_dir || !hits || !hits.size) return true;
        const descendants = ids.filter((child) => child !== id &&
          (byId.get(child).path || '').startsWith((p.path || '') + '/'));
        const covered = new Set();
        for (const child of descendants) {
          const files = memberships.get(rid + '\n' + child);
          if (!files) return true; // Older graph@1 snapshots retain all links.
          for (const file of files) covered.add(file);
        }
        return covered.size !== hits.size || [...hits].some((file) => !covered.has(file));
      }));
    }
    const dead = new Set(routes.filter((r) => r.matches === 0 || routePl.get(r.id).length === 0).map((r) => r.id));

    // principles grouped by their first axiom, in axiom order
    const groups = axioms.map((a) => ({ axiom: a, items: [] }));
    const gIndex = new Map(groups.map((g2, i) => [g2.axiom.id, i]));
    const loose = { axiom: null, items: [] };
    for (const p of principles.slice().sort((a, b) => natural(a.id, b.id))) {
      const first = prAx.get(p.id)[0];
      if (first != null && gIndex.has(first)) groups[gIndex.get(first)].items.push(p); else loose.items.push(p);
    }
    if (loose.items.length) groups.push(loose);
    const prOrder = groups.flatMap((g2) => g2.items);

    // places as a tree: directories by path, then root files
    const pathOf = (p) => p.path || p.id.replace(/^place:/, '');
    const isRootFile = (p) => !p.is_dir && !pathOf(p).includes('/');
    const sortKey = (p) => pathOf(p).toLowerCase().split('/').join('\u0000');
    const dirs = places.filter((p) => !isRootFile(p)).sort((a, b) => (sortKey(a) < sortKey(b) ? -1 : sortKey(a) > sortKey(b) ? 1 : 0));
    const roots = places.filter(isRootFile).sort((a, b) => natural(pathOf(a).toLowerCase(), pathOf(b).toLowerCase()));
    const pathSet = new Set(places.map(pathOf));
    const parentOf = (p) => {
      const parts = pathOf(p).split('/');
      for (let i = parts.length - 1; i > 0; i--) { const q = parts.slice(0, i).join('/'); if (pathSet.has(q)) return q; }
      return null;
    };

    // entry card membership
    const entryText = ((g.entry && g.entry.lines) || []).join('\n');
    const inEntry = new Set(principles.filter((p) => new RegExp('(^|[^\\w])' + p.id.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '([^\\w]|$)').test(entryText)).map((p) => p.id));
    const global = new Set(principles.filter((p) => p.global || (prRoutes.get(p.id) || []).filter((r) => !dead.has(r)).length === 0).map((p) => p.id));

    return {
      g, byId, axioms, principles: prOrder, routes, places, dirs, roots, groups, routePr, routePl, prAx, prRoutes, plRoutes,
      dead, pathOf, parentOf, inEntry, global, memberships, gaps: g.gaps || [],
      eff: (p) => (STRENGTH[p.effective] != null ? p.effective : 'prose'),
    };
  }

  // ------------------------------------------------------------------ layout
  function computeLayout(M, cw, ch) {
    const scale = clamp(Math.min(cw / 1260, ch / 760), 1, 1.25);
    let W = cw / scale, H = ch / scale;
    const LW = clamp(W, 1000, 1800);
    const top = 48, bottom = 18;
    const L = { LW: LW, top: top };
    const pad = 24;
    L.axW = clamp(LW * 0.15, 160, 230);
    L.barX = pad + L.axW + 14;
    L.idX = L.barX + 34;
    L.nameX = L.barX + 42;
    L.prW = clamp(LW * 0.27, 250, 400);
    L.anchorX = L.nameX + L.prW + 16;
    L.plW = clamp(LW * 0.17, 200, 270);
    L.placeX = LW - pad - L.plW - 14;
    L.routeX = L.anchorX + (L.placeX - L.anchorX) * 0.5;

    // principle rows: full titles wrap; rows and axiom groups size to their text
    const gapG = 14, minBand = 46, LINE = 18;
    L.lines = new Map(); L.rowH = new Map(); L.axLines = new Map();
    for (const g of M.groups) {
      for (const p of g.items) {
        const ls = wrap(p.name, F.pr, L.prW, 3);
        L.lines.set(p.id, ls);
        L.rowH.set(p.id, ls.length * LINE + 20 + 14);
      }
      if (g.axiom) L.axLines.set(g.axiom.id, wrap(g.axiom.name, F.axiom, L.axW - 8, 4));
    }
    const groupH = (g) => Math.max(
      g.items.reduce((s2, p) => s2 + L.rowH.get(p.id), 0),
      g.axiom ? Math.max(minBand, L.axLines.get(g.axiom.id).length * LINE + 26) : 0);
    const prH = () => M.groups.reduce((s2, g) => s2 + groupH(g), 0) + gapG * Math.max(0, M.groups.length - 1);
    // place rows
    const rows = [];
    for (const p of M.dirs) rows.push({ t: 'place', n: p });
    if (M.roots.length) { if (rows.length) rows.push({ t: 'sect', id: 'sect:root', label: 'Root files' }); for (const p of M.roots) rows.push({ t: 'place', n: p }); }
    const plH = (pitch) => rows.reduce((s2, r) => s2 + (r.t === 'sect' ? pitch * 0.7 + 12 : pitch), 0);

    const avail = H - top - bottom;
    let pl = 32; while (pl > 25 && plH(pl) > avail) pl -= 0.5;
    L.pitchL = pl;
    const LH = Math.max(H, top + bottom + Math.max(prH(), plH(pl)));
    L.LH = LH;
    L.y = new Map(); L.band = new Map(); L.rows = rows;

    let y = top + (LH - top - bottom - prH()) / 2;
    for (const g of M.groups) {
      const h = groupH(g);
      const rowsH = g.items.reduce((s2, p) => s2 + L.rowH.get(p.id), 0);
      let ry = y + (h - rowsH) / 2;
      for (const p of g.items) { const rh = L.rowH.get(p.id); L.y.set(p.id, ry + rh / 2); ry += rh; }
      if (g.axiom) {
        const a0 = y + 4, a1 = y + h - 4;
        L.band.set(g.axiom.id, { y0: a0, y1: a1, h: h });
        L.y.set(g.axiom.id, (a0 + a1) / 2);
      }
      y += h + gapG;
    }
    y = top + (LH - top - bottom - plH(pl)) / 2;
    for (const r of rows) {
      if (r.t === 'sect') { y += 12; L.y.set(r.id, y + pl * 0.35); y += pl * 0.7; continue; }
      L.y.set(r.t === 'place' ? r.n.id : r.id, y + pl / 2);
      y += pl;
    }
    // route junctions: ordered by what they join (fewer crossings), then spread evenly over the
    // principle block so that every label has its own row; positions never depend on selection
    const order = M.routes.map((r) => {
      const ps = M.routePr.get(r.id).map((p) => L.y.get(p)).filter((v) => v != null);
      const ls = M.routePl.get(r.id).map((p) => L.y.get(p)).filter((v) => v != null);
      const mean = (a) => a.reduce((s2, v) => s2 + v, 0) / a.length;
      const target = ls.length && ps.length ? 0.5 * mean(ls) + 0.5 * mean(ps) : (ps.length ? mean(ps) : ls.length ? mean(ls) : LH);
      return { id: r.id, t: target + (M.dead.has(r.id) ? 1e6 : 0) };
    }).sort((a, b) => a.t - b.t || natural(a.id, b.id));
    const prYs = M.principles.map((p) => L.y.get(p.id));
    const lo = Math.min.apply(null, prYs.concat([top + 30])), hi = Math.max.apply(null, prYs.concat([lo]));
    const step = order.length > 1 ? Math.max(46, (hi - lo) / (order.length - 1)) : 0;
    const start = order.length > 1 ? lo + Math.max(0, ((hi - lo) - step * (order.length - 1)) / 2) : (lo + hi) / 2;
    order.forEach((o, i) => L.y.set(o.id, start + i * step));
    L.routeOrder = order.map((o) => o.id);
    return { L: L, scale: scale };
  }

  // ------------------------------------------------------------------ drawing
  function ensureLayers() {
    if (S.layers) return S.layers;
    const vp = el('g', { id: 'vp' }, svg);
    S.layers = { vp: vp, heads: el('g', {}, vp), links: el('g', {}, vp), nodes: el('g', {}, vp) };
    return S.layers;
  }

  function drawHeads(L) {
    const h = S.layers.heads;
    h.textContent = '';
    const y = 24;
    txt(h, L.barX - 14, y, 'Axioms', 'colhead', { 'text-anchor': 'end' });
    txt(h, L.nameX, y, 'Principles', 'colhead');
    txt(h, L.routeX, y, 'Routes', 'colhead', { 'text-anchor': 'middle' });
    txt(h, L.placeX - 4, y, 'Places', 'colhead');
    txt(h, L.placeX + 14 + L.plW, y, 'files', 'colhead', { 'text-anchor': 'end' });
    el('line', { x1: 24, x2: L.LW - 24, y1: 38, y2: 38, class: 'colrule' }, h);
  }

  function nodeGroup(id, kind) {
    let rec = S.nodes.get(id);
    if (!rec) {
      const g = el('g', { class: 'node ' + kind, 'data-id': id, tabindex: '-1', role: 'button' }, S.layers.nodes);
      if (kind === 'sect') { g.setAttribute('class', 'sect-g'); g.removeAttribute('tabindex'); g.removeAttribute('role'); g.setAttribute('aria-hidden', 'true'); }
      g.style.opacity = '0';
      rec = { g: g, kind: kind, fresh: true };
      S.nodes.set(id, rec);
    } else {
      rec.fresh = false;
      rec.g.setAttribute('class', (kind === 'sect' ? 'sect-g' : 'node ' + kind));
    }
    rec.g.textContent = '';
    rec.alive = true;
    return rec;
  }

  function drawAxiom(a, L, M) {
    const rec = nodeGroup(a.id, 'axiom');
    const g = rec.g, b = L.band.get(a.id), cy = L.y.get(a.id);
    const n = M.groups.find((x) => x.axiom === a).items.length;
    const r0 = b.y0 - cy, r1 = b.y1 - cy;
    el('rect', { class: 'hit', x: 16, y: r0 - 4, width: L.barX - 10, height: r1 - r0 + 8, rx: 5 }, g);
    el('rect', { class: 'ring', x: 16, y: r0 - 4, width: L.barX - 10, height: r1 - r0 + 8, rx: 5 }, g);
    el('rect', { class: 'ax-bar', x: L.barX - 3, y: r0, width: 6, height: r1 - r0, rx: 3 }, g);
    const lines = L.axLines.get(a.id) || [a.name];
    const meta = a.id + ' · ' + plural(n, 'principle');
    const blockH = lines.length * 18 + 16;
    let y0 = -blockH / 2 + 9;
    for (const line of lines) { txt(g, L.barX - 14, y0, line, 'ax-name', { 'text-anchor': 'end' }); y0 += 18; }
    txt(g, L.barX - 14, y0, meta, 'ax-meta', { 'text-anchor': 'end' });
    el('title', {}, g).textContent = a.name + '. ' + (a.plain || '');
    g.setAttribute('aria-label', 'Axiom ' + a.id + ': ' + a.name + '. ' + plural(n, 'principle') + '.');
  }

  function drawPrinciple(p, L, M) {
    const eff = M.eff(p), dec = STRENGTH[p.declared] != null ? p.declared : eff;
    const s = STRENGTH[eff], d = STRENGTH[dec];
    const rec = nodeGroup(p.id, 'principle' + (s === 0 ? ' prose' : ''));
    const g = rec.g;
    const rowH = L.rowH.get(p.id) - 4;
    el('rect', { class: 'hit', x: L.barX + 8, y: -rowH / 2, width: L.anchorX - L.barX - 2, height: rowH, rx: 5 }, g);
    el('rect', { class: 'ring', x: L.barX + 8, y: -rowH / 2, width: L.anchorX - L.barX - 2, height: rowH, rx: 5 }, g);
    txt(g, L.idX, 0, p.id, 'pr-id', { 'text-anchor': 'end' });
    // the full title, wrapped, then one metadata line: configured mechanism and any difference
    const lines = L.lines.get(p.id) || [p.name];
    const contentH = lines.length * 18 + 20;
    let ly = -contentH / 2 + 9;
    for (const line of lines) { txt(g, L.nameX, ly, line, 'pr-name'); ly += 18; }
    const my = ly + 2;
    g.querySelector('.pr-id').setAttribute('y', -contentH / 2 + 9);
    const mc = MODE_CLASS[eff], tw = width(MODE_NAME[eff], F.tag) + 12;
    el('rect', { class: 'tag-bg ' + mc, x: L.nameX, y: my - 9, width: tw, height: 18, rx: 4 }, g);
    txt(g, L.nameX + tw / 2, my + 0.5, MODE_NAME[eff], 'tag-txt ' + mc, { 'text-anchor': 'middle' });
    const missing = (p.enforcers || []).filter((e) => e.status && e.status !== 'present').length;
    const bits = [];
    if (d > s) bits.push(['declared ' + dec, 'pr-note']);
    if (missing) bits.push([missing + ' missing', 'pr-note']);
    if (M.global.has(p.id)) bits.push(['repo-wide', 'pr-every']);
    let mx = L.nameX + tw + 10;
    for (const b of bits) { txt(g, mx, my, b[0], b[1] + ' pr-meta'); mx += width(b[0], F.mono12) + 14; }
    el('circle', { class: 'anchor' + (M.global.has(p.id) ? ' open' : ''), cx: L.anchorX, cy: 0, r: 3.25 }, g);
    // in a session trace: what the hooks did with this principle, after the configured mechanism
    const said = sessionPill(p.id, mx - 4, L.anchorX - 10);
    if (said) {
      el('rect', { class: 'ev-bg ' + said.cls, x: said.x, y: my - 9, width: said.w, height: 18, rx: 9 }, g);
      txt(g, said.x + said.w / 2, my + 0.5, said.text, 'ev-txt ' + said.cls, { 'text-anchor': 'middle' });
    }
    el('title', {}, g).textContent = p.name + ' (' + p.id + '). ' + (p.one || '') + (said ? ' In this session: ' + said.full + '.' : '');
    g.setAttribute('aria-label', 'Principle ' + p.id + ': ' + p.name + '. Configured: ' + (s === 0 ? 'written guidance only' : eff) + (d > s ? '; declared ' + dec + ', configuration differs' : '') + '.');
  }

  function drawRoute(r, L, M) {
    const isDead = M.dead.has(r.id);
    const rec = nodeGroup(r.id, 'route' + (isDead ? ' dead' : ''));
    const g = rec.g;
    const name = r.name || r.id.replace(/^route:/, '');
    const w = Math.max(width(name, F.mono11) + 16, 40);
    const sent = sessionRouteNote(r.id);
    const w2 = Math.max(w, isDead ? width('0 matched files', F.tag) + 16 : 0, sent ? width(sent.text, '400 11.5px ' + SANS) + 16 : 0), hb = isDead || sent ? 46 : 34;
    el('rect', { class: 'hit', x: L.routeX - w2 / 2, y: -26, width: w2, height: hb, rx: 5 }, g);
    el('rect', { class: 'ring', x: L.routeX - w2 / 2, y: -26, width: w2, height: hb, rx: 5 }, g);
    const tw = width(name, F.mono11) + 8;
    el('rect', { class: 'rt-plate', x: L.routeX - tw / 2, y: -22, width: tw, height: 16, rx: 3 }, g);
    txt(g, L.routeX, -14, name, 'rt-label', { 'text-anchor': 'middle' });
    if (isDead) txt(g, L.routeX, 16, '0 matched files', 'rt-zero', { 'text-anchor': 'middle' });
    else if (sent) {
      const sw = width(sent.text, '400 11.5px ' + SANS) + 8;
      el('rect', { class: 'rt-plate', x: L.routeX - sw / 2, y: 8, width: sw, height: 16, rx: 3 }, g);
      txt(g, L.routeX, 16, sent.text, sent.cls, { 'text-anchor': 'middle' });
    }
    el('circle', { class: 'rt-dot', cx: L.routeX, cy: 0, r: 5 }, g);
    if (!isDead) el('circle', { class: 'rt-core', cx: L.routeX, cy: 0, r: 2 }, g);
    el('title', {}, g).textContent = 'Route ' + name + (isDead ? ': matches no file' : ': ' + plural(r.matches || 0, 'file') + ' matched');
    g.setAttribute('aria-label', 'Route ' + name + (isDead ? ', matches no file' : ', ' + plural(M.routePl.get(r.id).length, 'place')) + '.');
  }

  function drawPlace(p, L, M) {
    const rec = nodeGroup(p.id, 'place');
    const g = rec.g;
    const path = M.pathOf(p);
    const parent = M.parentOf(p);
    const indent = parent ? 16 : 0;
    const routed = (M.plRoutes.get(p.id) || []).length > 0;
    const exposed = p.sensitive && !routed;
    const h = L.pitchL;
    el('rect', { class: 'hit', x: L.placeX - 10, y: -h / 2 + 1, width: L.plW + 28, height: h - 2, rx: 4 }, g);
    el('rect', { class: 'ring', x: L.placeX - 10, y: -h / 2 + 1, width: L.plW + 28, height: h - 2, rx: 4 }, g);
    el('circle', { class: 'pl-mark' + (exposed ? ' exposed' : routed ? '' : ' open'), cx: L.placeX, cy: 0, r: 4 }, g);
    const visit = sessionPlaceNote(p.id);
    if (visit) el('circle', { class: 'pl-visit', cx: L.placeX, cy: 0, r: 7.5 }, g);
    const lx = L.placeX + 14 + indent;
    if (parent) {
      const py = L.y.get('place:' + parent);
      const up = py != null ? Math.min(L.y.get(p.id) - py - 7, h) : h * 0.6;
      el('path', { class: 'tree', d: 'M' + (lx - 9) + ' ' + (-up) + ' V0 H' + (lx - 3) }, g);
    }
    const label = parent ? path.slice(parent.length + 1) : path;
    const shown = label + (p.is_dir ? '/' : '');
    const right = L.placeX + 14 + L.plW;
    let rightText = visit || (exposed ? 'sensitive, no route' : String(p.files != null ? p.files : ''));
    const rw = width(rightText, F.mono12) + 10;
    txt(g, right, 0, rightText, visit ? 'pl-how' : exposed ? 'pl-note' : 'pl-count', { 'text-anchor': 'end' });
    txt(g, lx, 0, fit(shown, F.place, right - rw - lx), 'pl-name' + (routed ? '' : ' quiet'));
    el('title', {}, g).textContent = path + (p.is_dir ? '/' : '') + ' · ' + plural(p.files || 0, 'file') + (routed ? '' : ' · no route') + (visit ? ' · ' + visit + ' in this session' : '');
    g.setAttribute('aria-label', 'Place ' + path + '. ' + plural(p.files || 0, 'file') + '. ' + (routed ? plural(M.plRoutes.get(p.id).length, 'route') : 'No route') + (exposed ? ', sensitive' : '') + '.');
  }

  function drawGhost(row, L) {
    const rec = nodeGroup(row.id, 'ghost');
    const g = rec.g, r = row.r;
    const h = L.pitchL;
    el('rect', { class: 'hit', x: L.placeX - 10, y: -h / 2 + 1, width: L.plW + 28, height: h - 2, rx: 4 }, g);
    el('rect', { class: 'ring', x: L.placeX - 10, y: -h / 2 + 1, width: L.plW + 28, height: h - 2, rx: 4 }, g);
    el('rect', { class: 'gh-mark', x: L.placeX - 4, y: -4, width: 8, height: 8, rx: 1 }, g);
    const pats = (r.paths || []).join(', ');
    txt(g, L.placeX + 14, 0, fit(pats || 'no paths', F.ghost, L.plW), 'gh-label');
    el('title', {}, g).textContent = 'Route ' + (r.name || r.id) + ' matches no file: ' + pats;
    g.setAttribute('aria-label', 'Route ' + (r.name || r.id) + ' matches no file.');
  }

  function drawSect(row, L) {
    const rec = nodeGroup(row.id, 'sect');
    txt(rec.g, L.placeX - 4, 0, row.label, 'sect');
  }

  // links: computed from current (possibly animating) row positions
  function linkSpecs(M) {
    const out = [];
    for (const r of M.routes) {
      for (const p of M.routePr.get(r.id)) out.push({ key: 'a|' + r.id + '|' + p, kind: 'applies', from: p, to: r.id, dead: M.dead.has(r.id) });
      for (const pl of M.routePl.get(r.id)) out.push({ key: 'g|' + r.id + '|' + pl, kind: 'governs', from: r.id, to: pl });
    }
    for (const p of M.principles) for (const a of M.prAx.get(p.id).slice(1)) out.push({ key: 's|' + p.id + '|' + a, kind: 'serves', from: p.id, to: a });
    return out;
  }
  function linkPath(sp, L) {
    const y = (id) => (S.cur.has(id) ? S.cur.get(id) : L.y.get(id));
    let x1, y1, x2, y2;
    if (sp.kind === 'applies') { x1 = L.anchorX + 3; y1 = y(sp.from); x2 = L.routeX - 5; y2 = y(sp.to); }
    else if (sp.kind === 'governs') { x1 = L.routeX + 5; y1 = y(sp.from); x2 = L.placeX - 5; y2 = y(sp.to); }
    else {
      const b = L.band.get(sp.to); const py = y(sp.from);
      x1 = L.barX + 12; y1 = py; x2 = L.barX + 3; y2 = b ? clamp(py, b.y0 + (y(sp.to) - L.y.get(sp.to)), b.y1 + (y(sp.to) - L.y.get(sp.to))) : y(sp.to);
      const mx = x1 - 26;
      return 'M' + x1 + ' ' + y1 + ' C' + mx + ' ' + y1 + ' ' + mx + ' ' + y2 + ' ' + x2 + ' ' + y2;
    }
    if (y1 == null || y2 == null) return '';
    const mx = (x1 + x2) / 2;
    return 'M' + x1 + ' ' + y1 + ' C' + mx + ' ' + y1 + ' ' + mx + ' ' + y2 + ' ' + x2 + ' ' + y2;
  }

  function placeNodes() {
    for (const [id, rec] of S.nodes) {
      const y = S.cur.get(id);
      if (y != null) rec.g.setAttribute('transform', 'translate(0 ' + y.toFixed(2) + ')');
    }
    for (const [, lk] of S.links) lk.path.setAttribute('d', linkPath(lk.sp, S.L));
  }

  function render(animate) {
    const M = S.M = buildModel(S.graph);
    const wrapEl = $('mapWrap');
    const cw = Math.max(svg.clientWidth || wrapEl.clientWidth, 320), ch = Math.max(svg.clientHeight, 300);
    const narrow = cw < 760;
    const res = computeLayout(M, narrow ? 1100 : cw, narrow ? 760 : ch);
    const L = S.L = res.L;
    ensureLayers();
    drawHeads(L);
    for (const rec of S.nodes.values()) rec.alive = false;

    for (const a of M.axioms) if (L.band.has(a.id)) drawAxiom(a, L, M);
    for (const p of M.principles) drawPrinciple(p, L, M);
    for (const r of M.routes) drawRoute(r, L, M);
    for (const row of L.rows) {
      if (row.t === 'place') drawPlace(row.n, L, M);
      else if (row.t === 'ghost') drawGhost(row, L);
      else drawSect(row, L);
    }
    // removed nodes fade away
    for (const [id, rec] of S.nodes) {
      if (rec.alive) continue;
      rec.g.style.opacity = '0';
      rec.g.style.pointerEvents = 'none';
      S.nodes.delete(id);
      setTimeout(() => rec.g.remove(), reduceMotion ? 0 : 320);
    }
    // links, keyed
    const specs = linkSpecs(M);
    const keep = new Set(specs.map((s) => s.key));
    for (const [k, lk] of S.links) if (!keep.has(k)) { lk.path.style.opacity = '0'; S.links.delete(k); setTimeout(() => lk.path.remove(), reduceMotion ? 0 : 320); }
    for (const sp of specs) {
      let lk = S.links.get(sp.key);
      if (!lk) { lk = { path: el('path', {}, S.layers.links) }; lk.path.style.opacity = '0'; S.links.set(sp.key, lk); }
      lk.sp = sp;
      lk.path.setAttribute('class', 'lnk ' + sp.kind + (sp.dead ? ' dead' : ''));
    }
    // positions: tween from where things are drawn now
    const from = new Map(S.cur);
    const targets = new Map();
    for (const id of S.nodes.keys()) if (L.y.has(id)) targets.set(id, L.y.get(id));
    const token = ++S.tween;
    const dur = animate && !reduceMotion ? 560 : 0;
    const t0 = performance.now();
    const step = (now) => {
      if (token !== S.tween) return;
      const t = dur ? Math.min(1, (now - t0) / dur) : 1;
      const e = t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
      S.cur = new Map();
      for (const [id, to] of targets) { const f = from.has(id) ? from.get(id) : to; S.cur.set(id, f + (to - f) * e); }
      placeNodes();
      if (t < 1) requestAnimationFrame(step);
    };
    step(t0);
    if (dur) requestAnimationFrame(step);

    // view: fit layout into the window, keep the person's zoom and pan
    if (narrow) {
      // small screens: the whole map fitted to the width, in a box sized to it
      const k = (cw - 8) / L.LW;
      svg.style.height = Math.round(L.LH * k + 8) + 'px';
      S.base = { k: k, x: 4, y: 4 };
    } else {
      svg.style.height = '';
      const kw = Math.min(res.scale, cw / L.LW);
      const k = Math.min(kw, ch / L.LH);
      S.base = { k: k, x: Math.max(0, (cw - L.LW * k) / 2), y: Math.max(0, (ch - L.LH * k) / 2) };
    }
    applyView();
    renderStandPicker();
    renderTrace();
    emphasis();
    // fresh nodes fade in after positions are set
    requestAnimationFrame(() => emphasis());
    ensureFocusable();
  }

  // ------------------------------------------------------------------ emphasis
  // The map draws the connections of one traced route at a time. Selecting a principle or place
  // opens its details without expanding the drawing into its other routes. "Show all connections"
  // is the explicit opt-in for the whole topology.
  function traceSet(rid) {
    const M = S.M, set = new Set([rid]);
    for (const p of M.routePr.get(rid) || []) { set.add(p); for (const a of M.prAx.get(p) || []) set.add(a); }
    for (const pl of M.routePl.get(rid) || []) set.add(pl);
    return set;
  }
  function activeRoute() {
    if (S.session) return null;
    const n = S.hover && S.M.byId.get(S.hover);
    if (n && n.kind === 'route') return n.id;
    return S.showAll ? null : S.trace;
  }
  function defaultRoute(M) {
    const m = /(?:^|[#&])route=([^&]+)/.exec(location.hash || '');
    if (m && M.byId.has('route:' + decodeURIComponent(m[1]))) return 'route:' + decodeURIComponent(m[1]);
    const live = M.routes.filter((r) => !M.dead.has(r.id));
    live.sort((a, b) => M.routePr.get(b.id).length - M.routePr.get(a.id).length || M.routePl.get(a.id).length - M.routePl.get(b.id).length || natural(a.id, b.id));
    return live.length ? live[0].id : null;
  }
  function faded(id) {
    const M = S.M, n = M.byId.get(id);
    if (!n) return id.startsWith('ghost:');
    if (n.kind === 'principle') return STRENGTH[M.eff(n)] < 3;
    if (n.kind === 'route') return M.dead.has(id) || M.routePr.get(id).every((p) => faded(p));
    if (n.kind === 'axiom') return M.principles.filter((p) => M.prAx.get(p.id)[0] === id).every((p) => faded(p.id));
    return false;
  }
  function standFactor(id) {
    const M = S.M, at = S.standAt;
    const R = new Set(M.plRoutes.get(at) || []);
    const P = new Set(); for (const r of R) for (const p of M.routePr.get(r)) P.add(p);
    for (const p of M.global) P.add(p);
    const n = M.byId.get(id);
    if (id === at) return 1;
    if (!n) return 0.14;
    if (n.kind === 'place') return 0.16;
    if (n.kind === 'route') return R.has(id) ? 1 : 0.14;
    if (n.kind === 'principle') return P.has(id) ? 1 : 0.42;
    if (n.kind === 'axiom') return M.principles.some((p) => P.has(p.id) && M.prAx.get(p.id).includes(id)) ? 1 : 0.42;
    return 1;
  }
  function emphasis() {
    if (!S.M) return;
    if (S.session) { sessionEmphasis(); return; }
    const M = S.M;
    const tr = activeRoute();
    let part = null;
    if (S.levelHover) part = new Set(M.principles.filter((p) => M.eff(p) === S.levelHover).map((p) => p.id));
    else if (tr) part = traceSet(tr);
    for (const [id, rec] of S.nodes) {
      if (rec.kind === 'sect') { rec.g.style.opacity = S.standAt ? '0.3' : '1'; continue; }
      let op = 1;
      if (S.enforcedOnly && faded(id)) op *= 0.16;
      if (S.standAt) op *= standFactor(id);
      if (part && !part.has(id)) op *= 0.72;
      rec.g.style.opacity = String(op);
      rec.g.classList.toggle('lit', !!(part && part.has(id) && id !== S.selected && !S.levelHover));
      rec.g.classList.toggle('selected', id === S.selected);
      rec.g.classList.toggle('traced', id === tr);
    }
    const R = S.standAt ? new Set(M.plRoutes.get(S.standAt) || []) : null;
    for (const [, lk] of S.links) {
      const sp = lk.sp;
      const onTrace = !!tr && (sp.from === tr || sp.to === tr);
      const onStand = !!R && ((sp.kind === 'applies' && R.has(sp.to)) || (sp.kind === 'governs' && sp.to === S.standAt));
      const show = sp.kind === 'serves' || S.showAll || onTrace || onStand;
      lk.path.classList.toggle('hidden', !show);
      if (!show) continue;
      let op = sp.kind === 'serves' ? 0.6 : 0.75;
      if (S.enforcedOnly && (faded(sp.from) || faded(sp.to))) op *= 0.12;
      lk.path.classList.toggle('lit', onTrace && !S.levelHover);
      lk.path.style.opacity = String(onTrace ? 1 : Math.min(op, 1));
    }
  }
  function renderTrace() {
    const M = S.M, box = $('trace');
    if (!M) return;
    renderMobile();
    if (S.session) { box.innerHTML = sessionBar(); return; }
    const tr = S.showAll ? null : S.trace;
    if (S.showAll) { box.innerHTML = '<span class="lab">All connections</span><span>Every route is drawn. Turn this off to trace one route at a time.</span>' + traceButtons(); return; }
    if (!tr) { box.innerHTML = '<span class="lab">No route traced</span><span>Select a route in the middle column to draw its principles and places.</span>' + traceButtons(); return; }
    const r = M.byId.get(tr), dead = M.dead.has(tr);
    const np = (M.routePr.get(tr) || []).length, nl = (M.routePl.get(tr) || []).length;
    box.innerHTML = '<span class="lab">Tracing route</span><span class="rname' + (dead ? ' dead' : '') + '">' + esc(r.name || tr) + '</span><span>' +
      plural(np, 'principle') + ' · ' + (dead ? '0 matched files' : plural(nl, 'place') + ' · ' + plural(r.matches || 0, 'matched file')) + '</span>' +
      '<button type="button" class="clear" id="traceClear">Clear</button>' + traceButtons();
  }
  function traceButtons() {
    return '<span class="trace-opens"><button type="button" class="clear" data-trace-open="1">Open a session trace</button>' +
      (S.exampleUrl ? '<button type="button" class="clear" data-trace-example="1">Recorded example</button>' : '') + '</span>';
  }
  function matchedPlaceText(rid, id) {
    const files = S.M.memberships.get(rid + '\n' + id);
    return files ? plural(files.size, 'matched file') : plural((S.M.byId.get(id) || {}).files || 0, 'file') + ' inside';
  }
  function renderMobile() {
    const M = S.M, picker = $('routePick'), box = $('mobileTrace');
    const ms = $('mobileSess');
    ms.hidden = false;
    ms.innerHTML = S.session ? '<h2>Session trace</h2><p>' + plural(S.session.steps.length, 'recorded step') +
      ', listed with the rules they met below the route view.</p><div class="trace-open"><button type="button" data-trace-leave="1">Back to the plain map</button></div>'
      : '<div class="trace-open"><button type="button" data-trace-open="1">Open a session trace</button>' + (S.exampleUrl ? '<button type="button" data-trace-example="1">Recorded example</button>' : '') + '</div>';
    const options = '<option value="">Choose a route</option>' + M.routes.map((r) =>
      '<option value="' + esc(r.id) + '">' + esc(r.name || r.id) + ' (' + plural(r.matches || 0, 'matched file') + ')</option>').join('');
    if (picker.innerHTML !== options) picker.innerHTML = options;
    picker.value = S.trace || '';
    const placePicker = $('placePick');
    const placeOptions = '<option value="">Choose any place</option>' + M.places.map((pl) =>
      '<option value="' + esc(pl.id) + '">' + esc(M.pathOf(pl)) +
      (pl.observation === 'declared_only' ? ' (no visible files)' : '') + '</option>').join('');
    if (placePicker.innerHTML !== placeOptions) placePicker.innerHTML = placeOptions;
    placePicker.value = S.selected && S.selected.startsWith('place:') ? S.selected : '';

    const r = S.trace && M.byId.get(S.trace);
    if (!r) { box.innerHTML = '<p>Choose a route to read its principles and matched places.</p>'; return; }
    const ps = (M.routePr.get(r.id) || []).map((id) => M.byId.get(id)).filter(Boolean);

    for (const aid of M.prAx.get(p.id) || []) {
      const a = M.byId.get(aid);
      const inh = ((a && a.sources) || []).filter((r) => !seen.has(r.ref + '#' + (r.at || '')));
      if (!inh.length) continue;
      inh.forEach((r) => seen.add(r.ref + '#' + (r.at || '')));
      src += '<p class="inherit">Through axiom ' + esc(aid) + ' · ' + esc(a.name) + '</p>' + sourcesHTML(inh, true);
    }
    if (src) h += '<h3>Source and adaptation</h3>' + src;
    if (p.enforcers && p.enforcers.length) {
      h += '<h3>Mechanisms named</h3>';
      for (const e of p.enforcers) {
        const n = M.byId.get('enf:' + e.ref) || {};
        const missing = e.status && e.status !== 'present';
        const bits = [n.type, n.level || e.level, n.file].filter(Boolean).join(' · ');
        h += '<div class="enf"><span class="ref">' + esc(e.ref) + '</span><span class="st' + (missing ? ' missing' : '') + '">' + (missing ? 'missing' : 'present') + (bits && !missing ? ' · ' + esc(bits) : '') + '</span></div>';
      }
    }
    const axs = M.prAx.get(p.id) || [];
    if (axs.length) h += '<h3>Serves</h3><ul>' + axs.map((a) => rowBtn(a, esc(M.byId.get(a).name), a)).join('') + '</ul>';
    return h;
  }
  function routeHTML(r) {
    const M = S.M, isDead = M.dead.has(r.id);
    const ps = (M.routePr.get(r.id) || []).map((id) => M.byId.get(id)).filter(Boolean);
    const pls = M.routePl.get(r.id) || [];
    let h = '<div class="kind"><span>Route' + (S.trace === r.id && !S.showAll ? ' · traced on the map' : '') + '</span></div><h2 class="mono" style="font-size:17px">' + esc(r.name || r.id) + '</h2>';
    const on = (r.on || []).map((o) => ON_WORDS[o] || o);
    h += '<dl class="facts">' +
      '<dt>Paths</dt><dd class="mono">' + (r.paths || []).map(esc).join('<br>') + '</dd>' +
      '<dt>Matched</dt><dd' + (isDead ? ' class="differs"' : '') + '>' + plural(r.matches || 0, 'file') + (isDead ? '. Nothing in the repository receives this route.' : ', shown in ' + plural(pls.length, 'place')) + '</dd>' +
      (on.length ? '<dt>Delivered</dt><dd>Once per session, when an agent ' + esc(on.join(' or ')) + ' in a matched place</dd>' : '') +
      '<dt>Execution</dt><dd style="color:var(--ink-2)">Not assessed by this map</dd></dl>';
    if (ps.length) h += '<h3>Principles it carries</h3><ul>' + ps.map(principleRow).join('') + '</ul>' +
      '<p style="font-size:12.5px;color:var(--muted);margin-top:6px">Each principle keeps its own mechanism; the route has no strength of its own.</p>';
    if (r.reminder) h += '<h3>Reminder text</h3><p class="reminder">' + esc(r.reminder) + '</p>';
    h += skillsHTML(r.skills);
    if (pls.length) h += '<h3>Places it matches</h3><ul>' + pls.map((pl) => rowBtn(pl, '<span class="mono">' + esc(placeName(pl)) + '</span>', matchedPlaceText(r.id, pl))).join('') + '</ul>' +
      '<p style="font-size:12.5px;color:var(--muted);margin-top:6px">A parent is omitted only when the matched files are fully represented by its children. Remaining overlapping counts should not be added. Older snapshots show total files inside each place.</p>';
    return h;
  }
  function skillsHTML(skills) {
    if (!skills || !skills.length) return '';
    return '<h3>Workflows on this route</h3><p>Read the relevant skill before working. These links are guidance; they do not run a workflow or establish enforcement.</p>' + skills.map((skill) =>
      '<details class="skill-source"><summary><span class="mono">' + esc(skill.path) + '</span>' +
      (skill.status === 'missing' ? ' · missing' : ' · read skill') + '</summary><p>' + esc(skill.when) + '</p>' +
      (typeof skill.text === 'string' ? '<pre style="white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px">' + esc(skill.text) + '</pre>' : '<p>Skill text is unavailable in this snapshot. Open the named source in the repository.</p>') + '</details>').join('');
  }

  function purposeHTML(pl) {
    if (!pl.policy_source) return '<p>Folder purposes are not supplied by this snapshot.</p>';
    let h = '<h3>Purpose</h3><p>' + esc(pl.purpose || 'Purpose not declared') + '</p>';
    if (pl.purpose) h += '<p class="sub">Declared in <span class="mono">' + esc(pl.policy_source) + '</span> for <span class="mono">' + esc(pl.purpose_path) + '/</span>.</p>';
    else h += '<p>Add a purpose to <span class="mono">' + esc(pl.policy_source) + '</span> when it helps explain this folder. Ordinary folder additions need no new approval.</p>';
    if (pl.guide) h += '<p>Owner guide: <span class="mono">' + esc(pl.guide) + '</span></p>';
    if (pl.observation === 'declared_only') h += '<p>No visible files in this snapshot. The folder may be empty, ignored, or not yet created.</p>';
    return h;
  }

  function placeHTML(pl) {
    const M = S.M;
    const routes = M.plRoutes.get(pl.id) || [];
    let h = '<div class="kind"><span>Place</span><span>' + plural(pl.files || 0, 'file') + '</span>' + (pl.sensitive ? '<span>sensitive</span>' : '') + '</div><h2 class="mono" style="font-size:17px">' + esc(placeName(pl.id)) + '</h2>';
    if (S.standAt === pl.id) h += '<p style="color:var(--muted)">Viewing from here. Everything the configuration does not associate with this place has faded.</p>';
    h += purposeHTML(pl);
    h += '<h3>Configured for this place</h3>';
    const e = S.graph.entry || {};
    h += '<p><b style="color:var(--ink);font-weight:600">1. The entry card</b>, on arrival: ' + plural((e.lines || []).length, 'line') + ' naming every axiom and principle in one line each.</p>';
    if (routes.length) {
      h += '<p><b style="color:var(--ink);font-weight:600">2. ' + (routes.length === 1 ? 'One route' : routes.length + ' routes') + '</b>, as factual reminders when it works here:</p>';
      for (const r of routes) {
        const rn = M.byId.get(r);
        const on = (rn.on || []).map((o) => ON_WORDS[o] || o).join(' or ');
        h += '<div class="route-block"><button type="button" class="row-btn" data-go="' + esc(r) + '"><span class="txt"><span class="rn">route ' + esc(rn.name || r) + '</span><br><span class="on">' + esc(on ? 'delivered when an agent ' + on + ' here' : '') + '</span></span></button>';
        if (rn.reminder) h += '<p class="reminder">' + esc(rn.reminder) + '</p>';
        h += skillsHTML(rn.skills);
        h += '<ul>' + (M.routePr.get(r) || []).map((id) => M.byId.get(id)).filter(Boolean).map(principleRow).join('') + '</ul></div>';
      }
    } else {
      h += '<p' + (pl.sensitive ? ' class="gapnote"' : '') + '>' + (pl.sensitive ? 'This place is sensitive, but no route covers it. ' : 'No route covers this place. ') + 'An agent here receives the entry card and nothing specific to this place.</p>';
    }
    const glob = M.principles.filter((p) => M.global.has(p.id));
    if (glob.length) h += '<p style="margin-top:14px"><b style="color:var(--ink);font-weight:600">' + (routes.length ? '3' : '2') + '. Principles that apply everywhere</b>, through the entry card and repository-wide hooks:</p><ul>' + glob.map(principleRow).join('') + '</ul>';
    h += entryHTML(true);
    return h;
  }
  function renderPanel() {
    if (!S.M) return;
    const M = S.M, id = S.selected;
    let n = id ? M.byId.get(id) : null;
    if (id && !n && id.startsWith('ghost:')) n = M.byId.get(id.slice(6));
    let h = '';
    if (n) h += '<button type="button" class="back" data-go="">← ' + (S.session ? 'Session trace' : 'Overview') + '</button>';
    if (!n && S.session) h += sessionHTML();
    else if (!n) h += overviewHTML();
    else if (n.kind === 'axiom') h += axiomHTML(n);
    else if (n.kind === 'principle') h += principleHTML(n);
    else if (n.kind === 'route') h += routeHTML(n);
    else if (n.kind === 'place') h += placeHTML(n);
    else h += overviewHTML();
    if (n && S.session) h += sessionAboutHTML(n.id);
    const scroll = S.panelFor === id ? panel.scrollTop : 0;
    panel.innerHTML = h;
    panel.scrollTop = scroll;
    S.panelFor = id;
  }

  function renderHeader() {
    const g = S.graph, d = g.doctrine || {}, r = g.repository || {};
    $('docName').textContent = d.name || 'Safety Core';
    $('docVer').textContent = d.version ? 'v' + d.version : '';
    $('repoName').textContent = r.name ? r.name + (r.commit ? ' @ ' + String(r.commit).slice(0, 7) : '') : '';
    document.title = (d.name ? d.name + ' · ' : '') + 'Safety Core rules';
    renderStatus();
  }
  function renderStatus() {
    const st = $('status'), t = $('statusText');
    st.classList.toggle('live', S.live);
    const when = S.graph && S.graph.generated_at ? fmtDate(S.graph.generated_at) : '';
    if (S.session && S.baseGraph) t.textContent = 'Session trace · configuration as of ' + when;
    else if (S.origin === 'sample') t.textContent = 'Sample data';
    else if (S.live) t.textContent = 'Live · redraws on each rebuild' + (S.lastRedraw ? ' · last ' + S.lastRedraw : '');
    else if (S.origin === 'inline') t.textContent = 'Snapshot · built ' + when;
    else t.textContent = 'Built ' + when;
    if (S.M) renderCoverage();
  }

  // ------------------------------------------------------------------ data
  async function loadGraph() {
    const inline = $('doctrine-graph');
    const raw = inline && inline.textContent.trim();
    if (raw) {
      try { return { graph: JSON.parse(raw), origin: 'inline' }; } catch (err) { /* fall through to fetch */ }
    }
    for (const [url, origin] of [['./graph.json', 'served'], ['./examples/graph.sample.json', 'sample'], ['../examples/graph.sample.json', 'sample']]) {
      try {
        const res = await fetch(url, { cache: 'no-store' });
        if (res.ok) return { graph: await res.json(), origin: origin };
      } catch (err) { /* try the next source */ }
    }
    return null;
  }
  function show(graph) {
    S.graph = graph;
    const first = !S.M;
    if (S.selected && !graph.nodes.some((n) => n.id === S.selected) && !(S.selected.startsWith('ghost:'))) S.selected = null;
    if (S.standAt && !graph.nodes.some((n) => n.id === S.standAt)) setStand(null);
    S.M = buildModel(graph);
    if (S.trace && !S.M.byId.has(S.trace)) S.trace = null;
    if (first) {
      S.trace = defaultRoute(S.M);
      S.showAll = /(?:^|[#&])all(?:&|$)/.test(location.hash || '');
      $('tAll').setAttribute('aria-pressed', String(S.showAll));
      if (S.trace) S.selected = S.trace;
    }
    renderHeader();
    renderCoverage();
    render(!first);
    renderPanel();
  }
  async function refetch() {
    try {
      const res = await fetch('./graph.json', { cache: 'no-store' });
      if (!res.ok) return;
      const g = await res.json();
      if (S.session && S.baseGraph) { S.baseGraph = g; return; }  // the trace's own graph stays drawn
      const d = new Date();
      S.lastRedraw = String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0') + ':' + String(d.getSeconds()).padStart(2, '0');
      show(g);
    } catch (err) { /* keep the current picture */ }
  }
  function listen() {
    if (S.origin !== 'served' || !('EventSource' in window)) return;
    let opened = false;
    const es = new EventSource('./events');
    es.onopen = () => { const again = opened; opened = true; S.live = true; renderStatus(); if (again) refetch(); };
    es.onmessage = () => refetch();
    es.onerror = () => { S.live = false; renderStatus(); if (!opened) es.close(); };
  }

  let resizeTimer = 0;
  window.addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(() => { if (S.graph) render(false); }, 80); });

  (async function start() {
    const got = await loadGraph();
    if (!got) {
      const m = $('message');
      m.hidden = false;
      m.innerHTML = '<div><p style="color:var(--ink);font-weight:600">No rule view found.</p><p>Run <span class="mono">safety.py map --serve</span> for a live map, or <span class="mono">safety.py map --out</span> for a single file with the graph inside.</p></div>';
      $('statusText').textContent = 'No data';
      return;
    }
    S.origin = got.origin;
    show(got.graph);
    listen();
    const inlineTrace = $('doctrine-trace') && $('doctrine-trace').textContent.trim();
    const param = new URLSearchParams(location.search).get('trace') || ((/(?:^|[#&])trace=([^&]+)/.exec(location.hash || '') || [])[1]);
    if (inlineTrace) { try { openTrace(JSON.parse(inlineTrace), 'The trace in this page'); } catch (err) { S.traceError = 'The trace in this page could not be read.'; renderPanel(); } }
    else if (param) fetchTrace(decodeURIComponent(param));
    probeExample();
  })();
})();
</script>
</body>
</html>
